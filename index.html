<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Bayam Tabur - POS System</title>

    <!-- ====== FAVICON ====== -->
    <link rel="icon" type="image/png" href="iconbayamtabur.png">
    <link rel="shortcut icon" type="image/png" href="iconbayamtabur.png">

    <!-- ====== PWA MANIFEST ====== -->
    <link rel="manifest" href="manifest.json">

    <!-- ====== WARNA TEMA ====== -->
    <meta name="theme-color" content="#4CAF50">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; 
            background: #f5f5f5; 
            height: 100vh; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
            z-index: 100;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .app-header .info {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .app-iframe {
            width: 100%;
            flex: 1;
            border: none;
            display: block;
            background: white;
        }

        /* ===== LOADING SCREEN ===== */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: 999;
        }
        .loading-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loading-content .logo-wrapper {
            width: 200px;
            height: 200px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(76, 175, 80, 0.25);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .loading-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .loading-content .loading-text {
            font-size: 0.9rem;
            color: #999;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .loading.hide {
            display: none;
        }

        @media (max-width: 768px) {
            .app-header h1 { font-size: 1rem; }
            .app-header .info { font-size: 0.7rem; }
            .loading-content .logo-wrapper {
                width: 160px;
                height: 160px;
                border-radius: 32px;
            }
            .loading-content .loading-text {
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .app-header { padding: 8px 12px; flex-wrap: wrap; gap: 5px; }
            .app-header h1 { font-size: 0.9rem; }
            .app-header .info { font-size: 0.65rem; }
            .loading-content .logo-wrapper {
                width: 140px;
                height: 140px;
                border-radius: 28px;
            }
            .loading-content .loading-text {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>🌿 Bayam Tabur</h1>
            <span class="info">📱 Aplikasi Kasir</span>
        </div>

        <iframe 
            id="mainIframe"
            class="app-iframe" 
            src="https://script.google.com/macros/s/AKfycbwpecsNQ3dEk0e7jMZIUVArKJ08sxx_OBWtj5-4oHXfTrSVh61Jp6VhIEq3T8SA7xhjaA/exec"
            allow="geolocation; microphone; camera; payment; autoplay">
        </iframe>
    </div>

    <!-- ===== LOADING SCREEN ===== -->
    <div class="loading" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-text">Memuat Aplikasi...</div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('mainIframe');
        const loading = document.getElementById('loadingScreen');

        iframe.addEventListener('load', function() {
            loading.classList.add('hide');
        });

        setTimeout(function() {
            loading.classList.add('hide');
        }, 5000);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/bayamtabur/service-worker.js')
                .then(() => console.log('✅ Service Worker terdaftar'))
                .catch(err => console.log('❌ Gagal daftar SW:', err));
        }

        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('📱 Aplikasi berjalan dalam mode standalone (PWA)');
        }
    </script>
</body>
</html>
