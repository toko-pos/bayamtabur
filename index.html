<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Bayam Tabur - POS System</title>

    <!-- ====== FAVICON ====== -->
    <link rel="icon" type="image/png" href="iconbayamtabur.png">
    <link rel="shortcut icon" type="image/png" href="iconbayamtabur.png">

    <!-- ====== PWA MANIFEST ====== -->
    <link rel="manifest" href="manifest.json">

    <!-- ====== WARNA TEMA ====== -->
    <meta name="theme-color" content="#4CAF50">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; 
            background: #f5f5f5; 
            height: 100vh; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
            z-index: 100;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .app-header .info {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .app-iframe {
            width: 100%;
            flex: 1;
            border: none;
            display: block;
            background: white;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: 999;
            font-family: Arial, sans-serif;
            color: #4CAF50;
            font-size: 1.2rem;
        }
        .loading img {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        .loading.hide {
            display: none;
        }
        @media (max-width: 768px) {
            .app-header h1 { font-size: 1rem; }
            .app-header .info { font-size: 0.7rem; }
        }
        @media (max-width: 480px) {
            .app-header { padding: 8px 12px; flex-wrap: wrap; gap: 5px; }
            .app-header h1 { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="app-header">
            <h1>🌿 Bayam Tabur</h1>
            <span class="info">📱 Aplikasi Kasir</span>
        </div>

        <!-- IFRAME -->
        <iframe 
            id="mainIframe"
            class="app-iframe" 
            src="https://script.google.com/macros/s/AKfycbyNsJE4KG_8HrelWz54GKA96OPMwyoSZ8sXYuZHYoRRGQQunNHGnG6EBV0B266uYt4rqw/exec"
            allow="geolocation; microphone; camera; payment; autoplay">
        </iframe>
    </div>

    <!-- LOADING SCREEN -->
    <div class="loading" id="loadingScreen">
        <div style="text-align:center;">
            <img src="iconbayamtabur.png" alt="Bayam Tabur" onerror="this.style.display='none'">
            <div>Memuat Aplikasi...</div>
        </div>
    </div>

    <script>
        // ====== HILANGKAN LOADING SAAT IFRAME SIAP ======
        const iframe = document.getElementById('mainIframe');
        const loading = document.getElementById('loadingScreen');

        iframe.addEventListener('load', function() {
            loading.classList.add('hide');
        });

        // Timeout jika loading terlalu lama (5 detik)
        setTimeout(function() {
            loading.classList.add('hide');
        }, 5000);

        // ====== REGISTER SERVICE WORKER ======
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('✅ Service Worker terdaftar'))
                .catch(err => console.log('❌ Gagal daftar SW:', err));
        }

        // ====== DETEKSI MODE PWA ======
        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('📱 Aplikasi berjalan dalam mode standalone (PWA)');
        }
    </script>
</body>
</html>
